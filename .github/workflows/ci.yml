name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: 1
        # -parallel 1: Windows -race + t.Parallel starves notify/watchdog
        # goroutines; the first two -race jobs failed on wait timeouts.
        run: go test -race -parallel 1 ./... -timeout 180s

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build
        run: go run ./tools/build

      - name: Retain build artifacts and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Test
        run: go test -race ./... -timeout 180s

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  compile-linux:
    name: compile (linux, GOOS=windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Compile Windows binaries
        run: go run ./tools/build -goos windows -goarch amd64

      - name: Retain cross-build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-windows-amd64-manifest
          path: dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
